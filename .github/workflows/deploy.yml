name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 6633
          script: |
            set -e

            export PATH="/home/saeid/versions/node/v24.19.0/bin:$PATH"

            cd /var/www/moradisaeid-app

            git fetch origin
            git reset --hard origin/main

            npm ci

            npm run build

            pm2 reload moradisaeid-app --update-env
